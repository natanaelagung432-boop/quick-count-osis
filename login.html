
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Quick Count OSIS</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen flex flex-col justify-between items-center p-4">

    <div class="w-full max-w-md flex flex-col items-center justify-center flex-grow py-8">

        <!-- LOGO -->
        <div class="flex items-center justify-center space-x-6 md:space-x-8 mb-8 w-full">

            <div class="flex items-center justify-center w-24 h-14 md:w-32 md:h-18 bg-white border-2 border-blue-500 rounded-full shadow-md p-1.5 overflow-hidden">
                <img id="logoSekolah"
                     src="assets/logo-sekolah.png"
                     alt="Logo Sekolah"
                     class="w-full h-full object-contain"
                     onerror="this.onerror=null;this.src='assets/logo-sekolah.jpg';">
            </div>

            <div class="flex items-center justify-center w-24 h-14 md:w-32 md:h-18 bg-white border-2 border-blue-500 rounded-full shadow-md p-1.5 overflow-hidden">
                <img id="logoOsis"
                     src="assets/logo-osis.png"
                     alt="Logo OSIS"
                     class="w-full h-full object-contain"
                     onerror="this.onerror=null;this.src='assets/logo-osis.jpg';">
            </div>

        </div>

        <!-- JUDUL -->
        <div class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-extrabold text-gray-800 tracking-wider uppercase">
                LOGIN
            </h1>

            <p class="text-xs md:text-sm text-gray-500 font-medium mt-1">
                Masuk untuk mengunggah atau mengelola data suara
            </p>
        </div>

        <!-- FORM LOGIN -->
        <form id="loginForm" class="w-full flex flex-col space-y-4 px-4">

            <div>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Username"
                    autocomplete="username"
                    required
                    class="w-full bg-blue-500 hover:bg-blue-600 focus:bg-blue-600 text-white placeholder-blue-100 font-semibold text-center text-lg md:text-xl py-3.5 px-6 rounded-2xl shadow-md focus:outline-none focus:ring-4 focus:ring-blue-300 transition duration-200">
            </div>

            <div>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                    class="w-full bg-blue-500 hover:bg-blue-600 focus:bg-blue-600 text-white placeholder-blue-100 font-semibold text-center text-lg md:text-xl py-3.5 px-6 rounded-2xl shadow-md focus:outline-none focus:ring-4 focus:ring-blue-300 transition duration-200">
            </div>

            <div id="loginMessage"
                 class="hidden text-center text-sm font-semibold p-3 rounded-lg"
                 role="status"
                 aria-live="polite">
            </div>

            <button
                id="loginButton"
                type="submit"
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-lg py-3 px-6 rounded-2xl shadow-lg hover:shadow-xl transform active:scale-95 transition duration-200 uppercase tracking-wider mt-2">
                MASUK
            </button>

            <a href="index.html"
               class="text-center text-xs md:text-sm text-gray-500 hover:text-gray-800 font-medium transition duration-200 mt-2 block">
                &larr; Kembali ke Halaman Utama
            </a>

        </form>

    </div>

    <!-- FOOTER -->
    <footer class="w-full text-center py-4 text-xs text-gray-400 font-medium">
        &copy; 2026 Quick Count Pemilu OSIS. Powered by Firebase & GitHub Pages.
    </footer>

    <!-- FIREBASE LOGIN -->
    <script type="module">

        import { db, ref, get } from './app.js';

        const loginForm = document.getElementById('loginForm');
        const loginMessage = document.getElementById('loginMessage');
        const loginButton = document.getElementById('loginButton');

        function showMessage(message, type = 'error') {

            const styles = {
                error: 'bg-red-100 text-red-700',
                success: 'bg-green-100 text-green-700',
                info: 'bg-blue-100 text-blue-700'
            };

            loginMessage.className =
                `text-center text-sm font-semibold p-3 rounded-lg block ${styles[type]}`;

            loginMessage.textContent = message;
        }

        function firebaseErrorMessage(error) {

            console.error('Firebase Error:', error);

            switch (error.code) {

                case 'PERMISSION_DENIED':
                case 'database/permission-denied':
                    return 'Akses database ditolak. Periksa Firebase Rules.';

                case 'NETWORK_ERROR':
                case 'unavailable':
                case 'database/unavailable':
                    return 'Server Firebase tidak dapat dijangkau. Periksa jaringan.';

                case 'auth/unauthorized-domain':
                    return 'Domain website belum diizinkan di Firebase.';

                default:
                    return 'Firebase Error: ' +
                        (error.code || error.message || 'Tidak diketahui');
            }
        }

        loginForm.addEventListener('submit', async (e) => {

            e.preventDefault();

            if (loginButton.disabled) return;

            const usernameInput =
                document.getElementById('username').value.trim();

            const passwordInput =
                document.getElementById('password').value;

            if (!usernameInput || !passwordInput) {
                showMessage('Username dan password wajib diisi.');
                return;
            }

            loginButton.disabled = true;
            loginButton.textContent = 'MEMVERIFIKASI...';

            showMessage('Menghubungkan ke database...', 'info');

            try {

                // Membaca database Firebase
                const snapshot = await get(ref(db, 'users'));

                if (!snapshot.exists()) {
                    showMessage(
                        'Data pengguna belum tersedia di database Firebase.'
                    );
                    return;
                }

                const users = snapshot.val();

                if (!users || typeof users !== 'object') {
                    showMessage('Struktur data pengguna tidak valid.');
                    return;
                }

                // Verifikasi username dan password
                let authenticatedUser = null;

                for (const key of Object.keys(users)) {

                    const user = users[key];

                    if (
                        user &&
                        user.username === usernameInput &&
                        user.password === passwordInput
                    ) {
                        authenticatedUser = user;
                        break;
                    }
                }

                if (!authenticatedUser) {
                    showMessage('Username atau password salah.');
                    return;
                }

                if (
                    !['saksi', 'superadmin'].includes(
                        authenticatedUser.role
                    )
                ) {
                    showMessage('Role pengguna tidak valid.');
                    return;
                }

                // Simpan sesi sederhana (belum merupakan autentikasi aman)
                localStorage.setItem(
                    'currentUser',
                    JSON.stringify({
                        username: authenticatedUser.username,
                        role: authenticatedUser.role
                    })
                );

                showMessage(
                    'Login berhasil! Mengalihkan halaman...',
                    'success'
                );

                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 1000);

            } catch (error) {

                showMessage(firebaseErrorMessage(error));

            } finally {

                loginButton.disabled = false;
                loginButton.textContent = 'MASUK';

            }

        });

    </script>

</body>
</html>
