<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Quick Count OSIS</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Family Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col justify-between items-center p-4">

    <!-- Container Utama -->
    <div class="w-full max-w-md flex flex-col items-center justify-center flex-grow py-8">
        
        <!-- Header Logo (Atas) -->
        <div class="flex items-center justify-center space-x-6 md:space-x-8 mb-8 w-full">
            <!-- Logo Sekolah -->
            <div class="flex items-center justify-center w-24 h-14 md:w-32 md:h-18 bg-white border-2 border-blue-500 rounded-full shadow-md p-1.5 overflow-hidden hover:scale-105 transition duration-300">
                <img id="logoSekolah" src="assets/logo-sekolah.png" alt="Logo Sekolah" class="w-full h-full object-contain" 
                     onerror="this.onerror=null; this.src='assets/logo-sekolah.jpg';">
            </div>

            <!-- Logo OSIS -->
            <div class="flex items-center justify-center w-24 h-14 md:w-32 md:h-18 bg-white border-2 border-blue-500 rounded-full shadow-md p-1.5 overflow-hidden hover:scale-105 transition duration-300">
                <img id="logoOsis" src="assets/logo-osis.png" alt="Logo OSIS" class="w-full h-full object-contain" 
                     onerror="this.onerror=null; this.src='assets/logo-osis.jpg';">
            </div>
        </div>

        <!-- Judul LOGIN (Tengah) -->
        <div class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-extrabold text-gray-800 tracking-wider uppercase">
                LOGIN
            </h1>
            <p class="text-xs md:text-sm text-gray-500 font-medium mt-1">
                Masuk untuk mengunggah atau mengelola data suara
            </p>
        </div>

        <!-- Form Login (Sesuai Sketsa) -->
        <form id="loginForm" class="w-full flex flex-col space-y-4 px-4">
            
            <!-- Input Username -->
            <div>
                <input type="text" 
                       id="username" 
                       name="username" 
                       placeholder="Username" 
                       required
                       class="w-full bg-blue-500 hover:bg-blue-600 focus:bg-blue-600 text-white placeholder-blue-100 font-semibold text-center text-lg md:text-xl py-3.5 px-6 rounded-2xl shadow-md focus:outline-none focus:ring-4 focus:ring-blue-300 transition duration-200">
            </div>

            <!-- Input Password -->
            <div>
                <input type="password" 
                       id="password" 
                       name="password" 
                       placeholder="Password" 
                       required
                       class="w-full bg-blue-500 hover:bg-blue-600 focus:bg-blue-600 text-white placeholder-blue-100 font-semibold text-center text-lg md:text-xl py-3.5 px-6 rounded-2xl shadow-md focus:outline-none focus:ring-4 focus:ring-blue-300 transition duration-200">
            </div>

            <!-- Pesan Notifikasi Error / Sukses -->
            <div id="loginMessage" class="hidden text-center text-sm font-semibold p-2 rounded-lg"></div>

            <!-- Tombol Submit / Masuk -->
            <button type="submit" 
                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-lg py-3 px-6 rounded-2xl shadow-lg hover:shadow-xl transform active:scale-95 transition duration-200 uppercase tracking-wider mt-2">
                MASUK
            </button>

            <!-- Tombol Kembali ke Halaman Utama -->
            <a href="index.html" 
               class="text-center text-xs md:text-sm text-gray-500 hover:text-gray-800 font-medium transition duration-200 mt-2 block">
                &larr; Kembali ke Halaman Utama
            </a>
        </form>

    </div>

    <!-- Footer -->
    <footer class="w-full text-center py-4 text-xs text-gray-400 font-medium">
        &copy; 2026 Quick Count Pemilu OSIS. Powered by Firebase & GitHub Pages.
    </footer>

    <!-- Firebase Authentication Script -->
    <script type="module">
        import { db, ref, get, child } from './app.js';

        const loginForm = document.getElementById('loginForm');
        const loginMessage = document.getElementById('loginMessage');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();

            loginMessage.className = "text-center text-sm font-semibold p-2 rounded-lg bg-blue-100 text-blue-700 block";
            loginMessage.innerText = "Memverifikasi...";

            try {
                // Ambil data pengguna/kredensial dari Firebase
                const dbRef = ref(db);
                const snapshot = await get(child(dbRef, 'users'));

                if (snapshot.exists()) {
                    const users = snapshot.val();
                    let authenticatedUser = null;

                    // Cari user yang sesuai username & password
                    Object.keys(users).forEach(key => {
                        const user = users[key];
                        if (user.username === usernameInput && user.password === passwordInput) {
                            authenticatedUser = user;
                        }
                    });

                    if (authenticatedUser) {
                        loginMessage.className = "text-center text-sm font-semibold p-2 rounded-lg bg-green-100 text-green-700 block";
                        loginMessage.innerText = "Login Berhasil! Mengalihkan...";

                        // Simpan sesi login sederhana di localStorage
                        localStorage.setItem('currentUser', JSON.stringify({
                            username: authenticatedUser.username,
                            role: authenticatedUser.role // 'saksi' atau 'superadmin'
                        }));

                        // Arahkan ke halaman admin
                        setTimeout(() => {
                            window.location.href = 'admin.html';
                        }, 1000);
                    } else {
                        // Fallback lokal default jika data di database belum diisi
                        if ((usernameInput === 'saksi' && passwordInput === 'saksi123') || 
                            (usernameInput === 'admin' && passwordInput === 'adminsuper123')) {
                            
                            const role = (usernameInput === 'admin') ? 'superadmin' : 'saksi';
                            
                            localStorage.setItem('currentUser', JSON.stringify({
                                username: usernameInput,
                                role: role
                            }));

                            loginMessage.className = "text-center text-sm font-semibold p-2 rounded-lg bg-green-100 text-green-700 block";
                            loginMessage.innerText = "Login Berhasil! Mengalihkan...";

                            setTimeout(() => {
                                window.location.href = 'admin.html';
                            }, 1000);
                        } else {
                            loginMessage.className = "text-center text-sm font-semibold p-2 rounded-lg bg-red-100 text-red-700 block";
                            loginMessage.innerText = "Username atau Password salah!";
                        }
                    }
                } else {
                    // Jika node 'users' belum dibuat di Firebase, gunakan fallback kredensial default
                    if (usernameInput === 'saksi' && passwordInput === 'saksi123') {
                        localStorage.setItem('currentUser', JSON.stringify({ username: 'saksi', role: 'saksi' }));
                        window.location.href = 'admin.html';
                    } else if (usernameInput === 'admin' && passwordInput === 'adminsuper123') {
                        localStorage.setItem('currentUser', JSON.stringify({ username: 'admin', role: 'superadmin' }));
                        window.location.href = 'admin.html';
                    } else {
                        loginMessage.className = "text-center text-sm font-semibold p-2 rounded-lg bg-red-100 text-red-700 block";
                        loginMessage.innerText = "Username atau Password salah!";
                    }
                }
            } catch (error) {
                console.error("Gagal melakukan login:", error);
                loginMessage.className = "text-center text-sm font-semibold p-2 rounded-lg bg-red-100 text-red-700 block";
                loginMessage.innerText = "Terjadi kesalahan koneksi. Periksa jaringan Anda.";
            }
        });
    </script>
</body>
</html>
